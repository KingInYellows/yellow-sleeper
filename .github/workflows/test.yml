name: test

# Re-implements the PR #16 CI skeleton (ruff + pytest on GitHub-hosted
# runners; head 3a253dd) with preview hardening: contents:read, SHA-pinned
# actions, timeouts, concurrency, persist-credentials: false, 3.11+3.12,
# packaging inspect, and stdio MCP smoke (covered by pytest).

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Clean install (frozen lock)
        run: uv sync --frozen --extra dev

      - name: Lockfile check
        run: uv lock --check

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Tests
        run: uv run python -m pytest tests/ -v --tb=short

      - name: Build and inspect sdist/wheel
        run: |
          uv build
          uv run python scripts/inspect_dist.py
