name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uv run --extra dev ruff check src/ tests/
      - name: Tests
        run: uv run --extra dev python -m pytest tests/ -q
